services:
  - type: web
    name: manfix-platform
    runtime: node
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_MANFIX_AUTH_URL
        value: https://manfix-auth.onrender.com
      - key: NEXT_PUBLIC_MANFIX_CUSTOMER_URL
        value: https://manfix-customer.onrender.com
      - key: NEXT_PUBLIC_MANFIX_SUPPLIER_URL
        value: https://manfix-supplier.onrender.com
      - key: NEXT_PUBLIC_MANFIX_WORKSHOP_URL
        value: https://manfix-workshop.onrender.com
      - key: NEXT_PUBLIC_MANFIX_TECHNICIAN_URL
        value: https://manfix-tech.onrender.com
      - key: NEXT_PUBLIC_MANFIX_ADMIN_URL
        value: https://manfix-admin.onrender.com
  - type: static
    name: manfix-auth
    buildCommand: npm ci && npm run build --workspace @manhub/auth-app
    staticPublishPath: ./apps/auth/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_MANFIX_AUTH_URL
        value: https://manfix-auth.onrender.com
      - key: VITE_MANFIX_CUSTOMER_URL
        value: https://manfix-customer.onrender.com
      - key: VITE_MANFIX_SUPPLIER_URL
        value: https://manfix-supplier.onrender.com
      - key: VITE_MANFIX_WORKSHOP_URL
        value: https://manfix-workshop.onrender.com
      - key: VITE_MANFIX_TECHNICIAN_URL
        value: https://manfix-tech.onrender.com
      - key: VITE_MANFIX_ADMIN_URL
        value: https://manfix-admin.onrender.com
